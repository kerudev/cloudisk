<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script type="module" src="/static/js/app.js" defer></script>
    <title>Cloudisk</title>
</head>
<body>
    <form id="user-form">
        <input type="text" placeholder="user" id="user" value="user">
        <input type="text" placeholder="mail" id="mail" value="mail">
        <input type="password" placeholder="pass" id="pass" value="pass">
        <input type="submit" value="Register" id="register" value="register">
        <input type="submit" value="Verify" id="verify" value="verify">
        <input type="submit" value="Login" id="login" value="login">
    </form>

    <button id="upload-btn" style="margin-top: 24px; margin-left: 24px;">Upload file(s)</button>
    <input id="upload-input" type="file" multiple hidden />
    <div id="root"></div>
</body>
</html>
